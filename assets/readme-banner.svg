<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">IELTS Speaking Coach and Examiner</title>
  <desc id="desc">Voice coaching and complete mock exams using shared question banks, illustrated with a microphone, waveform, and IELTS Speaking Part 1, Part 2, and Part 3 cards.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="25" x2="1130" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B33"/>
      <stop offset="0.52" stop-color="#113D5C"/>
      <stop offset="1" stop-color="#0B6E75"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00111F" flood-opacity="0.34"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#A5F3FC" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <circle cx="1092" cy="52" r="168" fill="#2DD4BF" fill-opacity="0.08"/>
  <circle cx="1038" cy="356" r="220" fill="#38BDF8" fill-opacity="0.07"/>
  <path d="M0 291C185 235 301 333 491 293C681 253 800 177 1200 248V360H0V291Z" fill="#08243C" fill-opacity="0.52"/>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="214" height="244" rx="34" fill="#F8FAFC" fill-opacity="0.96"/>
    <rect x="129" y="91" width="84" height="122" rx="42" fill="url(#accent)"/>
    <rect x="150" y="110" width="42" height="78" rx="21" fill="#07324B"/>
    <path d="M104 172C104 211 132 237 171 237C210 237 238 211 238 172" stroke="#07324B" stroke-width="12" stroke-linecap="round"/>
    <path d="M171 237V270M136 270H206" stroke="#07324B" stroke-width="12" stroke-linecap="round"/>
    <circle cx="171" cy="78" r="8" fill="#0F766E"/>
  </g>

  <g opacity="0.95">
    <rect x="317" y="84" width="10" height="30" rx="5" fill="#67E8F9"/>
    <rect x="337" y="67" width="10" height="64" rx="5" fill="#5EEAD4"/>
    <rect x="357" y="50" width="10" height="98" rx="5" fill="#67E8F9"/>
    <rect x="377" y="73" width="10" height="52" rx="5" fill="#5EEAD4"/>
    <rect x="397" y="58" width="10" height="82" rx="5" fill="#67E8F9"/>
  </g>

  <text x="317" y="195" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="760" letter-spacing="-1.8">IELTS Speaking</text>
  <text x="317" y="250" fill="#A5F3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="650" letter-spacing="2">COACH + EXAMINER</text>
  <text x="319" y="291" fill="#D7F9F5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="450">Voice coaching · Complete mocks · Shared question banks</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(925 72) rotate(-4)">
      <rect width="160" height="64" rx="18" fill="#E0F2FE"/>
      <circle cx="30" cy="32" r="18" fill="#0284C7"/>
      <text x="30" y="39" fill="white" font-size="19" font-weight="750" text-anchor="middle">1</text>
      <text x="58" y="39" fill="#0C4A6E" font-size="18" font-weight="700">INTERVIEW</text>
    </g>
    <g transform="translate(967 151) rotate(3)">
      <rect width="160" height="64" rx="18" fill="#CCFBF1"/>
      <circle cx="30" cy="32" r="18" fill="#0F766E"/>
      <text x="30" y="39" fill="white" font-size="19" font-weight="750" text-anchor="middle">2</text>
      <text x="58" y="39" fill="#134E4A" font-size="18" font-weight="700">LONG TURN</text>
    </g>
    <g transform="translate(911 235) rotate(-2)">
      <rect width="184" height="64" rx="18" fill="#F0FDFA"/>
      <circle cx="30" cy="32" r="18" fill="#0891B2"/>
      <text x="30" y="39" fill="white" font-size="19" font-weight="750" text-anchor="middle">3</text>
      <text x="58" y="39" fill="#164E63" font-size="18" font-weight="700">DISCUSSION</text>
    </g>
  </g>
</svg>
